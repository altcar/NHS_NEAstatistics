<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MazeRunner leaderboard - best scores for every player and level.">
  <title>Leaderboard · MazeRunner</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="pivot">
  <header class="site-header">
    <a class="brand" href="/pivot">Maze<span>Runner</span></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="/pivot" aria-current="page">Leaderboard</a>
      <a href="/cross">Statistics</a>
      <a href="/register">Register</a>
    </nav>
  </header>

  <main>
    <h1>Performance of each player</h1>
    <p class="subtitle">Best score per level. Scores are submitted automatically when a run is finished in the game.</p>

    <div class="table-wrapper">
      <table id="leaderboard">
        <caption>Best score for each player on each level</caption>
        <thead>
          <tr>
            <th scope="col">Player</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="empty">Loading leaderboard…</td></tr>
        </tbody>
      </table>
    </div>

    <p class="footer">Looking for level records? See the <a href="/cross">statistics</a> page.</p>
  </main>
</body>
</html>
